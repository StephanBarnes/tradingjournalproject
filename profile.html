<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Trade Journal</title>
    <link rel="stylesheet" href="sidebar.css" />
    <link rel="stylesheet" href="footer.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #191818;
            color: white;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        .dashboard-main {
            flex: 1;
            padding: 2rem;
            margin-left: 260px;
        }

        @media (max-width: 768px) {
            .dashboard-main {
                margin-left: 0;
                padding: 1rem;
            }

            .sidebar.open~.dashboard-main {
                margin-left: 260px;
            }
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            flex-direction: column;
            gap: 4px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }
        }

        .profile-card {
            background: linear-gradient(180deg, #1851d7, #292828);
            padding: 2.5rem;
            border-radius: 16px;
            max-width: 500px;
            margin: 2rem auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }


        .profile-avatar {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .profile-avatar img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #536dfd;
            box-shadow: 0 4px 10px rgba(83, 109, 253, 0.5);
            background-color: #1f1f1f;
        }

        .profile-info {
            margin-top: 1rem;
            text-align: left;
        }

        .profile-info label {
            display: block;
            margin-top: 14px;
            font-size: 0.95rem;
            color: #aaa;
        }

        .profile-info input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 8px;
            border: none;
            background-color: #1f1f1f;
            color: #eee;
            font-size: 1rem;
        }

        .profile-info input:disabled {
            opacity: 0.8;
        }

        .stats {
            margin-top: 2rem;
            background-color: #1f1f1f;
            padding: 1rem 2rem;
            border-radius: 10px;
            color: #ccc;
            font-size: 1rem;
        }

        .stats p {
            margin: 8px 0;
            font-weight: 500;
        }


        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-top: 1rem;
        }


        .file-upload-button {
            border: none;
            color: white;
            background-color: #536dfd;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }


        .file-upload-wrapper input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
    </style>

</head>

<body class="dashboard">
    <div class="dashboard-container">
        <div id="sidebar-container"></div>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <div style="display:flex; align-items:center;">
                    <button class="hamburger" id="hamburgerBtn">
                        <span></span><span></span><span></span>
                    </button>
                    <h2 style="margin-left: 1rem;">My Profile</h2>
                </div>
            </header>

            <div class="profile-card">
                <div class="profile-avatar">
                    <img id="profilePic" src="usericon.png" alt="User Avatar">
                    <form id="uploadForm" style="margin-top: 1rem;">
                        <button type="button" id="uploadButton"
                            style="background-color: #536dfd; padding: 10px 20px; border: none; border-radius: 8px; color: white; cursor: pointer;">
                            Change Profile Picture
                        </button>
                        <input type="file" id="profileImageInput" accept="image/*" style="display: none;">
                    </form>


                </div>


                <div class="profile-info">
                    <label>Username</label>
                    <input type="text" id="username" disabled />

                    <label>Email</label>
                    <input type="email" id="email" disabled />

                    <label>Registered On</label>
                    <input type="text" id="registered" disabled />

                </div>

                <div class="stats">
                    <p><strong>Total Trades:</strong> <span id="totalTrades">0</span></p>
                    <p><strong>Win Rate:</strong> <span id="winRate">0%</span></p>
                </div>
            </div>
        </main>
    </div>



    <div id="footer-container"></div>

    <script>
        fetch("sidebar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("sidebar-container").innerHTML = html;

                const hamburger = document.getElementById("hamburgerBtn");
                const sidebar = document.getElementById("sidebar");
                if (hamburger && sidebar) {
                    hamburger.addEventListener("click", () => {
                        sidebar.classList.toggle("open");
                    });
                }

                document.addEventListener("click", (e) => {
                    const isClickInsideSidebar = sidebar.contains(e.target);
                    const isClickOnHamburger = hamburgerBtn.contains(e.target);

                    if (!isClickInsideSidebar && !isClickOnHamburger && sidebar.classList.contains("open")) {
                        sidebar.classList.remove("open");
                        hamburgerBtn.style.display = "flex";
                    }
                });

                const token = localStorage.getItem("token");
                if (!token) return window.location.href = "login.html";

                // Fetch user profile
                fetch("http://localhost:5001/api/profile", {
                    headers: { Authorization: `Bearer ${token}` }
                })
                    .then(res => res.json())
                    .then(user => {
                        if (user.profilePicture) {
                            document.getElementById("sidebarPic").src = `http://localhost:5001/uploads/${user.profilePicture}`;
                        }
                        document.getElementById("sidebarName").textContent = user.username || "Trader";

                        document.getElementById("profilePic").src = user.profilePicture
                            ? `http://localhost:5001/uploads/${user.profilePicture}`
                            : "usericon.png";
                        document.getElementById("username").value = user.username || "";
                        document.getElementById("email").value = user.email || "";
                        document.getElementById("registered").value = new Date(user.createdAt).toLocaleDateString();

                        const logoutBtn = document.getElementById("logoutBtn");
                        if (logoutBtn) {
                            logoutBtn.addEventListener("click", () => {
                                localStorage.removeItem("token");
                                alert("Logged out successfully!");
                                window.location.href = "index.html";
                            });
                        }


                        fetch("http://localhost:5001/api/trades", {
                            headers: { Authorization: `Bearer ${token}` }
                        })
                            .then(res => res.json())
                            .then(trades => {
                                const totalTrades = trades.length;
                                const wins = trades.filter(t => t.winLoss === "Win").length;
                                const winRate = totalTrades > 0 ? ((wins / totalTrades) * 100).toFixed(2) : 0;

                                document.getElementById("totalTrades").textContent = totalTrades;
                                document.getElementById("winRate").textContent = `${winRate}%`;
                            })
                            .catch(err => console.error("🚨 Error fetching trades:", err.message));
                    })
                    .catch(err => console.error("🚨 Sidebar profile fetch error:", err.message));
            });
    </script>

    <script>
        fetch("footer.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("footer-container").innerHTML = html;
            });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const uploadButton = document.getElementById("uploadButton");
            const profileInput = document.getElementById("profileImageInput");
            const profilePic = document.getElementById("profilePic");

            uploadButton.addEventListener("click", () => {
                profileInput.click();
            });

            profileInput.addEventListener("change", async () => {
                const file = profileInput.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append("profilePic", file);

                try {
                    const token = localStorage.getItem("token");
                    const res = await fetch("http://localhost:5001/api/profile/picture", {
                        method: "POST",
                        headers: { Authorization: `Bearer ${token}` },
                        body: formData
                    });

                    if (!res.ok) throw new Error("Upload failed");

                    const data = await res.json();
                    alert("✅ Profile picture updated!");


                    const reader = new FileReader();
                    reader.onload = (e) => {
                        profilePic.src = e.target.result;
                    };
                    reader.readAsDataURL(file);

                } catch (err) {
                    console.error("🚨 Upload error:", err.message);
                    alert("Something went wrong. Please try again.");
                }
            });
        });
    </script>


</body>



</html>
