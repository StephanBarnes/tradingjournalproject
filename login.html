<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="footer.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #191818;
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-container {
            background: linear-gradient(180deg, #0e1d44, #1a3b80);
            width: 400px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .auth-container h1 {
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        .auth-container form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .auth-container input {
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
        }

        .auth-container button {
            padding: 0.8rem;
            background-color: #4CAF50;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .auth-container button:hover {
            background-color: #45a049;
        }

        .auth-container .switch {
            margin-top: 1rem;
            color: #d1d1d1;
        }

        .auth-container .switch a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            background-color: #121212;
            color: white;
            padding: 40px 20px;
            text-align: center;
            font-family: 'Inter', sans-serif;
        }

        .footer-logo {
            margin-bottom: 20px;
        }

        .footer-logo img {
            height: 40px;
            object-fit: contain;
        }

        .footer-links,
        .footer-policy {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin: 10px 0;
        }

        .footer-links a,
        .footer-policy a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .footer-links a:hover,
        .footer-policy a:hover {
            color: #999;
        }

        .footer-divider {
            width: 90%;
            margin: 30px auto;
            border: 1px solid white;
        }

        .footer-credits {
            font-size: 15px;
            margin-bottom: 10px;
            color: white;
        }

        @media (max-width: 480px) {
            .auth-container {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <h1>Log In</h1>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
            <p class="switch">Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
    </div>

    <footer>
        <div class="footer-logo">
            <img src="public/icon%20(4)-200h.png" alt="Logo">
        </div>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="#">About Us</a>
            <a href="#">Contact Us</a>
            <a href="#">FAQ</a>
            <a href="#">Terms of Service</a>
        </div>
        <div class="footer-divider"></div>
        <div class="footer-credits">© 2024 Trade Journal</div>
        <div class="footer-policy">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms and Conditions</a>
            <a href="#">Cookies Policy</a>
        </div>
    </footer>

    <script type="module">
        import apiService from "./services/apiService.js";

        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("loginForm").addEventListener("submit", async (e) => {
                e.preventDefault();

                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;

                try {
                    const response = await apiService.loginUser({ email, password });

                    if (response.token) {
                        localStorage.setItem("token", response.token);
                        alert("Login successful! Redirecting...");
                        window.location.href = "./Dashboard.html";
                    } else {
                        alert(`Error: ${response.message}`);
                    }
                } catch (error) {
                    console.error("Login error:", error.message);
                    alert("Something went wrong. Please try again.");
                }
            });
        });
    </script>
</body>

</html>
