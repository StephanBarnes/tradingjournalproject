<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="sidebar.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="footer.css" />

    <style>
        /* Base Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #191818;
            color: white;
            transition: background-color 0.3s, color 0.3s;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }



        /* Main Content */
        .dashboard-main {
            flex: 1;
            padding: 2rem;
            margin-left: 300px;
            transition: margin-left 0.5s ease;
        }

        @media (max-width: 768px) {
            .dashboard-main {
                margin-left: 0;
                padding: 1rem;
            }

            .sidebar.open~.dashboard-main {
                margin-left: 260px;
            }
        }

        /* Header & Topbar */
        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            margin-right: 1rem;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }
        }

        /* Filter Buttons */
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-buttons button {
            padding: 10px 16px;
            background-color: #536dfd;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-size: 0.95rem;
        }

        .filter-buttons button:hover {
            background-color: #405bdb;
        }

        /* Metrics Widgets */
        .metrics {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .widget {
            flex: 1;
            background-color: #292828;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            text-align: center;
            min-width: 150px;
        }

        .widget h3 {
            margin-bottom: 0.5rem;
            font-weight: normal;
        }

        .widget p {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00bfff;
        }

        @media (max-width: 768px) {
            .widget {
                min-width: 120px;
                margin-bottom: 1rem;
            }

            .widget p {
                font-size: 1.2rem;
            }
        }

        /* Charts */
        .charts {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 2rem;
        }

        .chart-container {
            background-color: #292828;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 600px;
            flex: 1;
        }

        .chart-container h3 {
            margin-bottom: 1rem;
        }

        .chart-container canvas {
            width: 100% !important;
            height: auto !important;
        }

        @media (max-width: 768px) {
            .chart-container {
                max-width: 100%;
                margin-bottom: 1rem;
            }
        }

        /* Trades Table & Extras */
        .table-container {
            background-color: #292828;
            padding: 20px;
            border-radius: 10px;
            margin-top: 2rem;
            overflow-x: auto;
        }

        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .table-controls input {
            padding: 8px;
            border-radius: 5px;
            border: none;
            width: 220px;
            margin-right: 10px;
        }

        .table-controls button {
            padding: 8px 12px;
            border: none;
            background-color: #536dfd;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .table-controls button:hover {
            background-color: #405bdb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: white;
        }

        table th,
        table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #444;
        }

        table th {
            background-color: #1a3b80;
        }

        @media (max-width: 768px) {

            table th,
            table td {
                padding: 8px 5px;
                font-size: 0.85rem;
            }
        }

        /* Edit/Delete Buttons */
        .edit-btn,
        .delete-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            margin: 0 3px;
            transition: background-color 0.2s;
        }

        .edit-btn {
            background-color: #4caf50;
            /* green */
            color: #fff;
        }

        .edit-btn:hover {
            background-color: #43a047;
            /* darker green */
        }

        .delete-btn {
            background-color: #f44336;
            /* red */
            color: #fff;
        }

        .delete-btn:hover {
            background-color: #e53935;
            /* darker red */
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        .modal-content {
            background-color: #292828;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 400px;
        }

        .modal-content h2 {
            margin-bottom: 1rem;
        }

        .modal-content input,
        .modal-content select,
        .modal-content button {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            border: none;
        }

        .modal-content button {
            background-color: #4caf50;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .modal-content button:hover {
            background-color: #45a049;
        }

        .close {
            float: right;
            font-size: 20px;
            cursor: pointer;
            color: white;
            margin: -5px;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <script>
            fetch('sidebar.html')
                .then(res => res.text())
                .then(html => {
                    document.getElementById('sidebar-container').innerHTML = html;
                });
        </script>

        <div id="sidebar-container"></div>

        <script>
            fetch("sidebar.html")
                .then(res => res.text())
                .then(html => {
                    document.getElementById("sidebar-container").innerHTML = html;

                    // 🔐 Token Check
                    const token = localStorage.getItem("token");
                    if (!token) return window.location.href = "login.html";

                    // 🧠 Sidebar logic (username, pic, logout)
                    fetch("http://localhost:5001/api/profile", {
                        headers: { Authorization: `Bearer ${token}` }
                    })
                        .then(res => res.json())
                        .then(user => {
                            if (user.profilePicture) {
                                document.getElementById("sidebarPic").src = `http://localhost:5001/uploads/${user.profilePicture}`;
                            }
                            document.getElementById("sidebarName").textContent = user.username || "Trader";

                            const logoutBtn = document.getElementById("logoutBtn");
                            if (logoutBtn) {
                                logoutBtn.addEventListener("click", () => {
                                    localStorage.removeItem("token");
                                    alert("Logged out successfully!");
                                    window.location.href = "index.html";
                                });
                            }
                        });

                    // ✅ Fix: Attach listener to "Import Trade" after sidebar is injected
                    const openTradeModalBtn = document.getElementById("openTradeModal");
                    if (openTradeModalBtn) {
                        openTradeModalBtn.addEventListener("click", () => {
                            editingTradeId = null;
                            document.getElementById("modalTitle").textContent = "Add Trade";
                            clearModalFields();
                            document.getElementById("tradeModal").style.display = "flex";
                        });
                    }

                    // ✅ Optional: Close Modal Handler (also safe here)
                    const closeModalBtn = document.getElementById("closeTradeModal");
                    if (closeModalBtn) {
                        closeModalBtn.addEventListener("click", () => {
                            document.getElementById("tradeModal").style.display = "none";
                        });
                    }

                    // ✅ Sidebar hamburger toggle
                    const hamburger = document.getElementById("hamburgerBtn");
                    const sidebar = document.getElementById("sidebar");
                    if (hamburger && sidebar) {
                        hamburger.addEventListener("click", () => sidebar.classList.toggle("open"));
                    }
                });
        </script>



        <!-- Main Content -->
        <main class="dashboard-main" id="dashboardMain">
            <header class="dashboard-header">
                <div style="display:flex; align-items:center;">
                    <button class="hamburger" id="hamburgerBtn">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <h2>Dashboard</h2>
                </div>
            </header>

            <div class="filter-buttons">
                <button data-filter="all">All Time</button>
                <button data-filter="today">Today</button>
                <button data-filter="week">Past Week</button>
                <button data-filter="month">Past Month</button>
                <button data-filter="3months">Past 3 Months</button>
                <button data-filter="year">Past Year</button>
            </div>

            <!-- Metrics -->
            <section class="metrics">
                <div class="widget">
                    <h3>Win Rate</h3>
                    <p id="win-rate">0%</p>
                </div>
                <div class="widget">
                    <h3>Total Trades</h3>
                    <p id="total-trades">0</p>
                </div>
                <div class="widget">
                    <h3>Total Wins</h3>
                    <p id="total-wins">0</p>
                </div>
                <div class="widget">
                    <h3>Total Losses</h3>
                    <p id="total-losses">0</p>
                </div>
                <div class="widget">
                    <h3>Total Risk to Reward</h3>
                    <p id="total-risk-reward">0</p>
                </div>
            </section>

            <!-- Charts side by side -->
            <section class="charts">
                <div class="chart-container">
                    <h3>Win Rate</h3>
                    <canvas id="winRateChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Risk to Reward by Month</h3>
                    <canvas id="riskRewardChart"></canvas>
                </div>
            </section>

            <!-- Trades List with Search and Export -->
            <section class="trades">
                <div class="table-controls">
                    <input type="text" id="tradeSearch" placeholder="Search by symbol" />
                    <button id="exportCSV">Export CSV</button>
                </div>
                <div class="table-container">
                    <table id="tradesTable">
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Risk:Reward</th>
                                <th>Chart</th>
                                <th>Outcome</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tradeTableBody">
                            <!-- Trade rows will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Trade Input Modal -->
    <div id="tradeModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeTradeModal">&times;</span>
            <h2 id="modalTitle">Add Trade</h2>
            <input type="text" id="symbol" placeholder="Symbol (e.g., AAPL)" required />
            <input type="date" id="date" required />
            <input type="time" id="time" required />
            <input type="number" id="riskToReward" placeholder="Risk to Reward Ratio" required />
            <input type="url" id="chartURL" placeholder="Chart URL" required />
            <select id="winLoss" required>
                <option value="">Select Outcome</option>
                <option value="Win">Win</option>
                <option value="Loss">Loss</option>
            </select>
            <button id="submitTrade">Save Trade</button>
        </div>
    </div>

    <script type="module">
        import apiService from "./services/apiService.js";

        let winRateChart, riskRewardChart;
        let editingTradeId = null; // Used for edit mode

        // Inside your DOMContentLoaded
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("token");
            if (!token) {
                alert("You must log in first!");
                window.location.href = "login.html";
                return;
            }

            const sidebar = document.getElementById("sidebar");
            const hamburgerBtn = document.getElementById("hamburgerBtn");
            if (hamburgerBtn && sidebar) {
                hamburgerBtn.addEventListener("click", () => {
                    sidebar.classList.toggle("open");
                });
            }

            const logoutBtn = document.getElementById("logoutBtn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", () => {
                    localStorage.removeItem("token");
                    alert("Logged out successfully!");
                    window.location.href = "index.html";
                });
            }

            const openModalBtn = document.getElementById("openTradeModal");
            if (openModalBtn) {
                openModalBtn.addEventListener("click", () => {
                    editingTradeId = null;
                    document.getElementById("modalTitle").textContent = "Add Trade";
                    clearModalFields();
                    tradeModal.style.display = "flex";
                });
            }

            const closeModalBtn = document.getElementById("closeTradeModal");
            if (closeModalBtn) {
                closeModalBtn.addEventListener("click", () => {
                    tradeModal.style.display = "none";
                });
            }

            const tradeSearch = document.getElementById("tradeSearch");
            if (tradeSearch) {
                tradeSearch.addEventListener("input", () => {
                    loadTrades(currentFilter);
                });
            }

            const exportCSVBtn = document.getElementById("exportCSV");
            if (exportCSVBtn) {
                exportCSVBtn.addEventListener("click", exportTradesToCSV);
            }

            // Continue with loading trades...
            let currentFilter = "all";
            document.querySelectorAll(".filter-buttons button").forEach((button) => {
                button.addEventListener("click", () => {
                    currentFilter = button.getAttribute("data-filter");
                    loadTrades(currentFilter);
                });
            });

            loadTrades(currentFilter);
        });

        // Function to clear modal fields
        function clearModalFields() {
            document.getElementById("symbol").value = "";
            document.getElementById("date").value = "";
            document.getElementById("time").value = "";
            document.getElementById("riskToReward").value = "";
            document.getElementById("chartURL").value = "";
            document.getElementById("winLoss").value = "";
        }

        // Load Trades with Filters & Search
        async function loadTrades(filter = "all") {
            console.log("📡 Fetching trades...");
            const token = localStorage.getItem("token");
            const trades = await apiService.getTrades(token);
            const now = new Date();
            let filteredTrades = trades;

            // Time-based filtering
            if (filter !== "all") {
                filteredTrades = trades.filter((trade) => {
                    const tradeDate = new Date(trade.date);
                    switch (filter) {
                        case "today":
                            return tradeDate.toDateString() === now.toDateString();
                        case "week":
                            return (now - tradeDate) / (1000 * 60 * 60 * 24) <= 7;
                        case "month":
                            return (now - tradeDate) / (1000 * 60 * 60 * 24) <= 30;
                        case "3months":
                            return (now - tradeDate) / (1000 * 60 * 60 * 24) <= 90;
                        case "year":
                            return (now - tradeDate) / (1000 * 60 * 60 * 24) <= 365;
                        default:
                            return true;
                    }
                });
            }

            // Search filtering by symbol (case-insensitive)
            const searchText = document.getElementById("tradeSearch").value.toLowerCase();
            if (searchText) {
                filteredTrades = filteredTrades.filter(trade =>
                    trade.symbol.toLowerCase().includes(searchText)
                );
            }

            // Update Metrics & Charts
            updateWinRateChart(filteredTrades);
            updateRiskRewardChart(filteredTrades);

            document.getElementById("total-trades").textContent = filteredTrades.length;
            document.getElementById("total-wins").textContent = filteredTrades.filter((t) => t.winLoss === "Win").length;
            document.getElementById("total-losses").textContent = filteredTrades.filter((t) => t.winLoss === "Loss").length;
            document.getElementById("win-rate").textContent =
                filteredTrades.length > 0
                    ? `${(
                        (filteredTrades.filter((t) => t.winLoss === "Win").length /
                            filteredTrades.length) *
                        100
                    ).toFixed(2)}%`
                    : "0%";
            document.getElementById("total-risk-reward").textContent =
                filteredTrades.length > 0
                    ? filteredTrades.reduce((sum, trade) => sum + trade.riskToReward, 0)
                    : 0;

            // Update Trades Table with Actions
            const tableBody = document.getElementById("tradeTableBody");
            tableBody.innerHTML = "";
            filteredTrades.forEach((trade) => {
                // Format date as dd/mm/yyyy
                const dateObj = new Date(trade.date);
                const dateFormatted = dateObj.toLocaleDateString("en-GB", {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                });

                const row = document.createElement("tr");
                row.innerHTML = `
          <td>${trade.symbol}</td>
          <td>${dateFormatted}</td>
          <td>${trade.time}</td>
          <td>${trade.riskToReward}</td>
          <td><a href="${trade.chartURL}" target="_blank">View</a></td>
          <td>${trade.winLoss}</td>
          <td>
            <button class="edit-btn">Edit</button>
            <button class="delete-btn">Delete</button>
          </td>
        `;
                // Edit button listener
                row.querySelector(".edit-btn").addEventListener("click", () => {
                    editingTradeId = trade._id;
                    document.getElementById("modalTitle").textContent = "Edit Trade";
                    document.getElementById("symbol").value = trade.symbol;
                    document.getElementById("date").value = trade.date;
                    document.getElementById("time").value = trade.time;
                    document.getElementById("riskToReward").value = trade.riskToReward;
                    document.getElementById("chartURL").value = trade.chartURL;
                    document.getElementById("winLoss").value = trade.winLoss;
                    document.getElementById("tradeModal").style.display = "flex";
                });
                // Delete button listener
                row.querySelector(".delete-btn").addEventListener("click", async () => {
                    if (confirm("Are you sure you want to delete this trade?")) {
                        try {
                            const token = localStorage.getItem("token");
                            const response = await apiService.deleteTrade(trade._id, token);
                            if (response.success) {
                                alert("Trade deleted successfully!");
                                loadTrades();
                            } else {
                                alert(`❌ Error: ${response.message || "Failed to delete trade"}`);
                            }
                        } catch (error) {
                            console.error("🚨 Error deleting trade:", error);
                            alert("Something went wrong. Please try again.");
                        }
                    }
                });
                tableBody.appendChild(row);
            });
        }

        // Update Win Rate Chart
        function updateWinRateChart(trades) {
            if (winRateChart) winRateChart.destroy();
            const winCount = trades.filter(t => t.winLoss === "Win").length;
            const lossCount = trades.filter(t => t.winLoss === "Loss").length;
            winRateChart = new Chart(document.getElementById("winRateChart"), {
                type: "doughnut",
                data: {
                    labels: ["Wins", "Losses"],
                    datasets: [
                        {
                            data: [winCount, lossCount],
                            backgroundColor: ["#4CAF50", "#FF4C4C"]
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: 1.5
                }
            });
        }

        // Update Risk to Reward Chart
        function updateRiskRewardChart(trades) {
            if (riskRewardChart) riskRewardChart.destroy();
            const monthlyData = Array(12).fill(0);
            trades.forEach(trade => {
                const tradeMonth = new Date(trade.date).getMonth();
                monthlyData[tradeMonth] += trade.riskToReward;
            });
            riskRewardChart = new Chart(document.getElementById("riskRewardChart"), {
                type: "bar",
                data: {
                    labels: [
                        "Jan", "Feb", "Mar", "Apr", "May", "Jun",
                        "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
                    ],
                    datasets: [
                        {
                            label: "Risk to Reward",
                            data: monthlyData,
                            backgroundColor: "#405bdb"
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: 1.8,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // Export Trades to CSV
        async function exportTradesToCSV() {
            const token = localStorage.getItem("token");
            const trades = await apiService.getTrades(token);
            let csvContent = "data:text/csv;charset=utf-8,Symbol,Date,Time,Risk:Reward,Chart,Outcome\n";
            trades.forEach(trade => {
                csvContent += `${trade.symbol},${trade.date},${trade.time},${trade.riskToReward},${trade.chartURL},${trade.winLoss}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "trades.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>

<!-- Footer Placeholder -->
<div id="footer-container"></div>

<script>
    fetch("footer.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("footer-container").innerHTML = html;
        });
</script>



</html>
