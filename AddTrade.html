<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Trade</title>
    <link rel="stylesheet" href="styles/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .trade-container {
            background: linear-gradient(135deg, #003366, #1a73e8);
            width: 500px;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7);
            text-align: left;
        }

        .trade-container h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #ffffff;
        }

        .trade-container form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .trade-container label {
            font-size: 1rem;
            margin-bottom: 0.2rem;
            color: #c8d8e4;
        }

        .trade-container input,
        .trade-container select,
        .trade-container textarea {
            padding: 0.9rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            background-color: #f4f4f4;
            color: #333;
        }

        .trade-container textarea {
            resize: none;
            height: 100px;
        }

        .trade-container button {
            padding: 0.9rem;
            background-color: #4CAF50;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .trade-container button:hover {
            background-color: #45a049;
        }

        .trade-container .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .trade-container .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .trade-container {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <div class="trade-container">
        <h1>Add New Trade</h1>
        <form id="tradeForm">
            <label for="date">Date</label>
            <input type="date" id="date" required>

            <label for="time">Time</label>
            <input type="time" id="time" required>

            <label for="symbol">Symbol</label>
            <input type="text" id="symbol" placeholder="e.g., AAPL" required>

            <label for="riskToReward">Risk-to-Reward</label>
            <input type="number" id="riskToReward" placeholder="e.g., 2.5" step="0.1" required>

            <label for="maxRiskToReward">Max Risk-to-Reward</label>
            <input type="number" id="maxRiskToReward" placeholder="e.g., 3.0" step="0.1" required>

            <label for="winLoss">Win / Loss</label>
            <select id="winLoss" required>
                <option value="Win">Win</option>
                <option value="Loss">Loss</option>
            </select>

            <label for="chartURL">Chart Image URL</label>
            <input type="url" id="chartURL" placeholder="e.g., https://example.com/chart.png" required>

            <label for="notes">Notes</label>
            <textarea id="notes" placeholder="Add any notes about the trade..."></textarea>

            <button type="submit">Add Trade</button>
        </form>
        <a href="./Dashboard.html" class="back-link">Back to Dashboard</a>
    </div>

    <script type="module">
        import apiService from "./services/apiService.js";

        document.getElementById('tradeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const tradeData = {
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                symbol: document.getElementById('symbol').value,
                riskToReward: parseFloat(document.getElementById('riskToReward').value),
                maxRiskToReward: parseFloat(document.getElementById('maxRiskToReward').value),
                winLoss: document.getElementById('winLoss').value,
                chartURL: document.getElementById('chartURL').value,
                notes: document.getElementById('notes').value,
            };

            const token = localStorage.getItem('token');
            if (!token) {
                alert("Please log in to add a trade.");
                return;
            }

            const response = await apiService.addTrade(tradeData, token);
            if (response.success) {
                alert("Trade added successfully!");
                window.location.href = './Dashboard.html';
            } else {
                alert(`Error: ${response.message}`);
            }
        });
    </script>
</body>

</html>
