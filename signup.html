<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #191818;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .auth-container {
            background: linear-gradient(180deg, #0e1d44, #1a3b80);
            width: 400px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .auth-container h1 {
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        .auth-container form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .auth-container input {
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
        }

        .auth-container button {
            padding: 0.8rem;
            background-color: #4CAF50;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .auth-container button:hover {
            background-color: #45a049;
        }

        .auth-container .switch {
            margin-top: 1rem;
            color: #d1d1d1;
        }

        .auth-container .switch a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .auth-container {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <h1>Sign Up</h1>
        <form id="signupForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>

    <script type="module">
        import apiService from "./services/apiService.js"; // ✅ Ensure this file exists

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('❌ Passwords do not match. Please try again.');
                return;
            }

            try {
                console.log("Attempting to register user...");

                // Call the register API
                const response = await apiService.registerUser({ username, email, password });

                if (response.token) {
                    alert('✅ Registration successful! Redirecting to login...');
                    window.location.href = './login.html'; // ✅ Redirect to login
                } else {
                    alert(`❌ Error: ${response.message || "Unknown error occurred."}`);
                }
            } catch (error) {
                console.error("Signup Error:", error);
                alert('⚠️ Server error. Please check console logs.');
            }
        });
    </script>
</body>

</html>
