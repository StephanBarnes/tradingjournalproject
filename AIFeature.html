<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Feature</title>
    <link rel="stylesheet" href="sidebar.css" />
    <link rel="stylesheet" href="footer.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #191818;
            color: white;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        .dashboard-main {
            flex: 1;
            padding: 2rem;
            margin-left: 260px;
        }

        @media (max-width: 768px) {
            .dashboard-main {
                margin-left: 0;
                padding: 1rem;
            }

            .sidebar.open~.dashboard-main {
                margin-left: 260px;
            }
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            flex-direction: column;
            gap: 4px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }
        }

        .table-container {
            background-color: #292828;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            margin: auto;
        }

        .table-container input,
        .table-container button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
        }


        .table-container button {
            background-color: #536dfd;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .table-container button:hover {
            background-color: #405bdb;
        }

        .table-container h3,
        .table-container h4 {
            margin-top: 20px;
        }

        hr {
            border: 1px solid #444;
            margin: 30px 0;
        }

        #manualPrediction,
        #csvTrainStatus,
        #mongoTrainStatus {
            margin-top: 10px;
            font-weight: bold;
        }

        .prediction-card {
            background-color: #1a3b80;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .file-upload-label {
            display: inline-block;
            width: 100%;
            padding: 12px 16px;
            background-color: #404040;
            color: white;
            font-weight: bold;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .file-upload-label:hover {
            background-color: #535353;
        }
    </style>
</head>

<body class="dashboard">
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <div style="display:flex; align-items:center;">
                    <button class="hamburger" id="hamburgerBtn">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>

                </div>
            </header>

            <section class="table-container">
                <h3>Predict Trade Outcome</h3>
                <input type="number" id="manualRiskReward" placeholder="e.g. 2.5" />
                <button onclick="predictManual()">Predict Outcome</button>
                <div id="manualPrediction" style="display: none;"></div>

                <hr />
                <h4>Train Model with CSV</h4>
                <label for="csvFile" class="file-upload-label">📁 Choose CSV File</label>
                <input type="file" id="csvFile" accept=".csv" style="display: none;" />
                <span id="csvFileName" style="display: block; margin-top: 8px; font-size: 0.9rem;"></span>
                <button onclick="trainModelCSV()">Train on CSV</button>
                <div id="csvTrainStatus"></div>

                <hr />
                <h4>Train with Your Trade History</h4>
                <button onclick="trainModelMongo()">Train on History</button>
                <div id="mongoTrainStatus"></div>

                <hr />
                <h4>Next 7 Trade Predictions</h4>
                <div id="predictionList">
                </div>
            </section>
        </main>
    </div>

    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";

        fetch("sidebar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("sidebar-container").innerHTML = html;

                // ⏳ Start profile fetch with retry
                loadProfileWithRetry(0);

                // Sidebar toggle + event logic
                requestAnimationFrame(() => {
                    const hamburger = document.getElementById("hamburgerBtn");
                    const sidebar = document.getElementById("sidebar");
                    if (hamburger && sidebar) {
                        hamburger.addEventListener("click", () => sidebar.classList.toggle("open"));
                    }

                    document.addEventListener("click", (e) => {
                        const isClickInsideSidebar = sidebar?.contains(e.target);
                        const isClickOnHamburger = hamburger?.contains(e.target);
                        if (!isClickInsideSidebar && !isClickOnHamburger && sidebar?.classList.contains("open")) {
                            sidebar.classList.remove("open");
                            hamburger.style.display = "flex";
                        }
                    });
                });
            })
            .catch(err => console.error("❌ Sidebar injection failed:", err));

        // ✅ Retry function to wait for backend readiness
        function loadProfileWithRetry(retries = 0) {
            if (retries > 10) {
                console.warn("❌ Gave up trying to fetch profile.");
                return;
            }

            fetch("http://localhost:5001/api/profile", {
                headers: { Authorization: `Bearer ${token}` }
            })
                .then(res => {
                    if (!res.ok) throw new Error("Backend not ready");
                    return res.json();
                })
                .then(user => {
                    const picEl = document.getElementById("sidebarPic");
                    const nameEl = document.getElementById("sidebarName");

                    if (user.profilePicture && picEl) {
                        picEl.src = `http://localhost:5001/uploads/${user.profilePicture}`;
                    }
                    if (nameEl) {
                        nameEl.textContent = user.username || "Trader";
                    }

                    const logoutBtn = document.getElementById("logoutBtn");
                    if (logoutBtn) {
                        logoutBtn.addEventListener("click", () => {
                            localStorage.removeItem("token");
                            alert("Logged out successfully!");
                            window.location.href = "index.html";
                        });
                    }
                })
                .catch(err => {
                    console.warn(`⏳ Retrying profile fetch (${retries + 1}/10)...`);
                    setTimeout(() => loadProfileWithRetry(retries + 1), 1000);
                });
        }
    </script>



    <script>

        async function safeLoadPredictions(retries = 0) {
            try {
                const ping = await fetch("http://localhost:5001/api/ping");
                if (!ping.ok) throw new Error("Not ready");
                loadSequencePredictions();
            } catch {
                if (retries > 10) {
                    document.getElementById("predictionList").innerHTML = "<p style='color: red;'>❌ Backend unavailable after training.</p>";
                    return;
                }
                setTimeout(() => safeLoadPredictions(retries + 1), 1000);
            }
        }

        async function predictManual() {
            const rr = document.getElementById("manualRiskReward").value;
            const res = await fetch("http://localhost:5001/api/ai/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ riskToReward: rr })
            });
            const data = await res.json();
            const resultDiv = document.getElementById("manualPrediction");
            resultDiv.style.display = "block";
            resultDiv.textContent = `📈 Outcome: ${data.outcome} (${(data.probability * 100).toFixed(1)}%)`;
        }

        async function trainModelMongo() {
            const btn = document.querySelector('[onclick="trainModelMongo()"]');
            btn.disabled = true;
            btn.textContent = "⏳ Training...";
            try {
                document.getElementById("mongoTrainStatus").textContent = "Training model...";
                const res = await fetch("http://localhost:5001/api/ai/train/mongo", { method: "POST" });

                if (!res.ok) throw new Error("Training failed");

                const data = await res.json();
                document.getElementById("mongoTrainStatus").textContent = data.message || "✅ Training Complete!";
                safeLoadPredictions();
            } catch (err) {
                document.getElementById("mongoTrainStatus").textContent = "❌ Training failed. Check backend logs.";
                console.error("Training error:", err);
            } finally {
                btn.disabled = false;
                btn.textContent = "🧠 Train on History";
            }
        }

        async function trainModelCSV() {
            const btn = document.querySelector('[onclick="trainModelCSV()"]');
            btn.disabled = true;
            btn.textContent = "⏳ Uploading & Training...";

            const file = document.getElementById("csvFile").files[0];
            if (!file) {
                alert("Please upload a CSV file.");
                btn.disabled = false;
                btn.textContent = "Train Model";
                return;
            }

            const formData = new FormData();
            formData.append("file", file);
            document.getElementById("csvTrainStatus").textContent = "Uploading and training...";

            try {
                const res = await fetch("http://localhost:5001/api/ai/train/csv", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                document.getElementById("csvTrainStatus").textContent = data.message || "CSV Training Complete!";
                safeLoadPredictions();
            } catch (err) {
                document.getElementById("csvTrainStatus").textContent = "❌ CSV training failed.";
                console.error("CSV Training Error:", err);
            } finally {
                btn.disabled = false;
                btn.textContent = "Train Model";
            }
        }

        async function loadSequencePredictions() {
            try {
                const res = await fetch("http://localhost:5001/api/ai/predict/sequence");
                const data = await res.json();
                const predictions = data.predictions || [];
                const list = document.getElementById("predictionList");

                if (predictions.length === 0) {
                    list.innerHTML = "<p>No predictions available.</p>";
                    return;
                }

                list.innerHTML = predictions.map(p => `
          <div class="prediction-card">
            <strong>Trade #${p.tradeNumber}:</strong> ${p.prediction > 0.5 ? "✅ Likely Win" : "❌ Likely Loss"} 
            <span style="float:right;">${(p.prediction * 100).toFixed(2)}%</span>
          </div>
        `).join("");
            } catch (err) {
                document.getElementById("predictionList").innerHTML = "<p style='color: red;'>❌ Error fetching predictions.</p>";
                console.error("Prediction error:", err);
            }
        }

        window.onload = () => safeLoadPredictions();
    </script>

</body>

<!-- Footer Placeholder -->
<div id="footer-container"></div>

<script>
    fetch("footer.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("footer-container").innerHTML = html;
        });
</script>

</html>
